name: Deploy
on:
  release:
    types: [published]
jobs:
  pypy-publish:
    name: Upload release to PyPi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nummus-financial
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies
        run: uv sync --locked --extra build
      - name: Build package
        run: uv run python -m build
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@v1.14.3
  docker-publish:
    name: Upload release to Docker Hub
    runs-on: ubuntu-latest
    environment:
      name: docker
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          tags: wattsup314/nummus-financial:latest,wattsup314/nummus-financial:${{ github.event.release.tag_name }}
          context: .
